
<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#075e54"
  >

  <meta
    name="description"
    content="KSK WhatsApp — निजी कुराकानी, समूह र अपडेटहरू।"
  >

  <meta name="color-scheme" content="light dark">

  <title>KSK WhatsApp</title>

  <link
    rel="stylesheet"
    href="./design-system.css"
  >

  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #f7f8fa;
    }

    body {
      min-height: 100dvh;
    }

    #waApp {
      min-height: 100dvh;
    }

    #waStartupFallback {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: #667781;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    #waStartupFallback[hidden] {
      display: none;
    }
  </style>

  <!-- Supabase Authentication -->
  <script
    defer
    src="./supabase-auth.js"
  ></script>

  <!-- Core services -->
  <script
    defer
    src="./supabase-profile.js"
  ></script>

  <script
    defer
    src="./supabase-friends.js"
  ></script>

  <script
    defer
    src="./supabase-messages.js"
  ></script>

  <script
    defer
    src="./supabase-posts.js"
  ></script>

  <script
    defer
    src="./supabase-notifications.js"
  ></script>

  <!-- Main application: always load last -->
  <script
    defer
    src="./app.js"
  ></script>
</head>

<body>
  <div
    id="waApp"
    data-wa-root
  ></div>

  <noscript>
    <main style="padding:24px;font-family:system-ui">
      यो एप चलाउन JavaScript सक्षम हुनुपर्छ।
    </main>
  </noscript>
</body>
</html>
